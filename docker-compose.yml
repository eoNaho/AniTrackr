services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: goanime-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      GOANIME_DATA_DIR: /data
      GOANIME_DOWNLOAD_PATH: /downloads
      # Opcional: se quiser usar path fixo diferente no binário
      # YT_DLP_PATH: /usr/bin/yt-dlp
      # FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - goanime_data:/data
      - goanime_downloads:/downloads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Sem NEXT_PUBLIC_BACKEND_URL => frontend usa mesma origem e Next faz proxy interno para backend
        NEXT_PUBLIC_BACKEND_URL: ""
        BACKEND_INTERNAL_URL: "http://backend:3001"
    container_name: goanime-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  goanime_data:
  goanime_downloads:
