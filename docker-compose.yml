services:
  backend:
    image: ghcr.io/eonaho/anitrackr-backend:latest
    container_name: anitrackr-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      ANITRACKR_DATA_DIR: /data
      ANITRACKR_DOWNLOAD_PATH: /downloads
    volumes:
      - anitrackr_data:/data
      - anitrackr_downloads:/downloads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/eonaho/anitrackr-web:latest
    container_name: anitrackr-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_URL: ""
      BACKEND_INTERNAL_URL: "http://backend:3001"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  anitrackr_data:
  anitrackr_downloads: