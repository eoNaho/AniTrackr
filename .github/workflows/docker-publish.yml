name: docker-publish

on:
  push:
    branches:
      - master
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - ".github/workflows/docker-publish.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Nota: o job "release" eleva contents para write via permissão de job.

jobs:
  # Detecta quais serviços mudaram para não rebuildar os dois desnecessariamente.
  # Em tags e workflow_dispatch sempre rebuilda tudo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/docker-publish.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/docker-publish.yml'

  backend:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anitrackr-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache por scope evita colisão entre backend e web no mesmo repo
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          # provenance=false para compatibilidade com CasaOS / Docker antigo
          provenance: false

  web:
    needs: changes
    if: |
      needs.changes.outputs.web == 'true'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anitrackr-web
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=
            BACKEND_INTERNAL_URL=http://backend:3001
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false

  # Cria a GitHub Release que o updater (/update/check) consome.
  # Só roda em push de tag v* e somente depois das imagens subirem com sucesso,
  # para não publicar release apontando para imagens quebradas/inexistentes.
  release:
    needs: [backend, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
