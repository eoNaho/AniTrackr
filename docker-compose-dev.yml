services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: anitrackr-backend
    restart: unless-stopped
    environment:
      ANITRACKR_RUNTIME: docker
      PORT: "3001"
      ANITRACKR_DATA_DIR: /data
      ANITRACKR_DOWNLOAD_PATH: /downloads
      ANITRACKR_QBITTORRENT_HOST: http://qbittorrent:8080
      ANITRACKR_QBITTORRENT_SAVE_PATH: /downloads
      # Opcional: se quiser usar path fixo diferente no binário
      # YT_DLP_PATH: /usr/bin/yt-dlp
      # FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - anitrackr_data:/data
      - anitrackr_downloads:/downloads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: anitrackr-qbittorrent
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - anitrackr_qbt_config:/config
      - anitrackr_downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Sem NEXT_PUBLIC_BACKEND_URL => frontend usa mesma origem e Next faz proxy interno para backend
        NEXT_PUBLIC_BACKEND_URL: ""
        BACKEND_INTERNAL_URL: "http://backend:3001"
    container_name: anitrackr-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  anitrackr_data:
  anitrackr_downloads:
  anitrackr_qbt_config:
